<style>
:root{--y:#FFB800;--k:#000;--w:#fff;--g:#bdbdbd;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:var(--w)}
body.idle{cursor:none}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;background:#000;overflow:hidden}

/* ---------- chrome ---------- */
#top{position:absolute;left:0;right:0;top:0;height:120px;display:flex;align-items:center;justify-content:space-between;padding:0 80px;z-index:20;background:linear-gradient(#000e,#0000);transition:opacity .6s}
#top img{height:52px}
#top .sede{font-size:22px;color:#ddd;border-left:2px solid #555;padding-left:22px;margin-left:22px}
#top .brand{display:flex;align-items:center}
#top .tag{font-size:22px;letter-spacing:5px;font-weight:700;color:var(--y)}
#bottom{position:absolute;left:80px;right:80px;bottom:44px;z-index:20;display:flex;gap:8px;transition:opacity .6s}
#bottom i{flex:1;height:6px;border-radius:3px;background:#ffffff26;overflow:hidden;position:relative}
#bottom i b{position:absolute;inset:0;width:0;background:var(--y)}
#bottom i.done b{width:100%}
body.videomode #top,body.videomode #bottom{opacity:0}

/* ---------- slides ---------- */
.slide{position:absolute;inset:0;visibility:hidden;opacity:0}
.slide.on{visibility:visible;opacity:1}
.slide .bg{position:absolute;inset:0;background:radial-gradient(ellipse at 80% 15%,#ffb80018,#0000 55%),#000}
.slide .bg.light{background:radial-gradient(ellipse at 15% 85%,#ffb80020,#0000 50%),#0b0b0b}
.pad{position:absolute;left:120px;right:120px;top:150px;bottom:110px}

/* entrance animations */
.a{opacity:0}
.on .a{animation:var(--an,up) .9s var(--ease) both;animation-delay:var(--d,0s)}
@keyframes up{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
@keyframes left{from{opacity:0;transform:translateX(-90px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(90px)}to{opacity:1;transform:none}}
@keyframes zoom{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}}
@keyframes kb{from{transform:scale(1.14)}to{transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 #ffb80000)}50%{transform:scale(1.05);filter:drop-shadow(0 0 40px #ffb80088)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

.eyebrow{color:var(--y);font-weight:700;letter-spacing:6px;font-size:26px;text-transform:uppercase}
.rule{display:block;height:8px;width:160px;background:var(--y);border-radius:4px;transform-origin:left}
.on .rule{--an:grow}

/* video */
.s-video video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#sound{position:absolute;right:60px;bottom:60px;z-index:30;background:#000c;border:2px solid var(--y);color:#fff;font-size:26px;padding:16px 26px;border-radius:40px;display:none;align-items:center;gap:12px}
#sound.show{display:flex;animation:fade .6s both}

/* cover */
.s-cover h1{font-size:190px;line-height:.95;letter-spacing:-7px;font-weight:700;margin:34px 0 46px}
.s-cover h1 span{display:block}
.s-cover p{font-size:40px;line-height:1.4;color:#e8e8e8;max-width:1050px;margin-bottom:20px}
.s-cover p strong{color:var(--y)}
.huella{position:absolute;right:150px;top:230px;width:520px;height:520px}
.huella .ring{position:absolute;inset:-60px;border-radius:50%;border:3px dashed #ffb80055;animation:spin 40s linear infinite}
.huella img{width:100%;animation:pulse 3.2s ease-in-out infinite}

/* intro / category */
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 220px}
.center h2{font-size:110px;line-height:1.05;letter-spacing:-3px;margin:30px 0}
.center p{font-size:42px;line-height:1.45;color:#ddd;max-width:1350px}
.catnum{font-size:300px;font-weight:700;color:transparent;-webkit-text-stroke:3px #ffb80066;position:absolute;right:120px;bottom:60px;line-height:1}
.caticon{width:190px;height:190px;border-radius:40px;background:#ffffff10;border:2px solid #ffb80055;display:grid;place-items:center;font-size:110px;animation:floaty 4s ease-in-out infinite}
.on .caticon{animation:zoom .9s var(--ease) both,floaty 4s ease-in-out 1s infinite}

/* teacher */
.chip{display:inline-flex;align-items:center;gap:14px;background:#ffffff12;border:1px solid #ffb80066;color:var(--y);font-size:24px;font-weight:700;letter-spacing:3px;text-transform:uppercase;padding:12px 26px;border-radius:40px}
.s-teacher .photo{position:absolute;left:120px;top:170px;width:700px;height:790px;border-radius:28px;overflow:hidden;border-bottom:12px solid var(--y);background:#222}
.s-teacher .photo img{width:100%;height:100%;object-fit:cover;object-position:center 25%}
.on .kb img{animation:kb 11s ease-out both}
.s-teacher .info{position:absolute;left:900px;right:120px;top:150px;bottom:110px;display:flex;flex-direction:column;justify-content:center}
.name{font-size:84px;line-height:1.05;letter-spacing:-2px;margin:28px 0 12px}
.school{font-size:36px;color:var(--y);font-weight:700;margin-bottom:36px}
.quote{position:relative;font-style:italic;color:#eee;line-height:1.45;padding-left:46px;border-left:6px solid var(--y)}
.quote strong{font-style:normal;color:var(--y)}
.quote:before{content:"“";position:absolute;left:-14px;top:-100px;font-size:220px;color:#ffb80033;font-style:normal;font-family:Georgia,serif}

/* story */
.s-story .head{position:absolute;left:120px;right:120px;top:150px}
.s-story h3{font-size:70px;line-height:1.08;letter-spacing:-1.5px;margin:22px 0 0}
.people{position:absolute;left:120px;right:120px;top:400px;display:flex;gap:36px}
.p-card{flex:0 0 auto;width:300px}
.p-card .ph{width:300px;height:300px;border-radius:24px;overflow:hidden;border-bottom:8px solid var(--y);background:#222}
.p-card .ph img{width:100%;height:100%;object-fit:cover;object-position:center 25%}
.p-card b{display:block;font-size:30px;margin:18px 0 6px;line-height:1.15}
.p-card small{display:block;font-size:22px;color:var(--y);font-weight:700;line-height:1.3}
.s-story .body{position:absolute;right:120px;top:400px;bottom:120px;display:flex;flex-direction:column;justify-content:center}
.ach{margin-top:30px;font-size:26px;line-height:1.45;background:#ffb80018;border:1px solid #ffb80055;border-radius:18px;padding:22px 28px;color:#f2f2f2}
.ach strong{color:var(--y)}

/* closing */
.s-closing h2{font-size:112px;letter-spacing:-3px;white-space:nowrap}
.s-closing .final{margin-top:50px;font-size:76px;font-weight:700;color:#000;background:var(--y);padding:18px 54px;border-radius:20px}
.heart{display:inline-block;animation:pulse 1.6s ease-in-out infinite}

/* wipe transition */
#wipe{position:absolute;inset:0;z-index:40;pointer-events:none;transform:translateX(-101%)}
#wipe:before,#wipe:after{content:"";position:absolute;top:0;bottom:0}
#wipe:before{left:0;width:100%;background:var(--y)}
#wipe:after{left:100%;width:30%;background:linear-gradient(90deg,#ffb800aa,#0000)}
#wipe.go{animation:wipe 1.1s cubic-bezier(.7,0,.3,1) forwards}
@keyframes wipe{0%{transform:translateX(-131%)}100%{transform:translateX(101%)}}

/* start overlay */
#start{position:absolute;inset:0;z-index:50;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:40px;cursor:pointer}
#start.show{display:flex}
#start .btn{width:180px;height:180px;border-radius:50%;background:var(--y);color:#000;display:grid;place-items:center;font-size:70px;padding-left:12px;animation:pulse 2s infinite}
#start p{font-size:40px;color:#ddd}
#paused{position:absolute;left:50%;top:60px;transform:translateX(-50%);z-index:30;background:#000c;border:2px solid var(--y);padding:12px 30px;border-radius:30px;font-size:26px;display:none}
body.pause #paused{display:block}
</style>
</head>

      <div ${A("fade",.2,"eyebrow")}>${esc(s.eyebrow)}</div><span ${A("grow",.4,"rule","margin-top:30px")}></span>
      <h2 ${A("up",.6)}>${esc(s.title)}</h2><p ${A("up",.9)}>${esc(s.text)}</p></div></div>`;
  case "category": return `<div class="slide s-category"><div class="bg"></div><div class="catnum a" style="--an:right;--d:.3s">${s.num}</div><div class="center">
      <div class="caticon">${s.icon}</div>
      <div ${A("fade",.5,"eyebrow","margin-top:44px")}>Historias que dejan huella · ${s.num}</div>
      <h2 ${A("up",.7)}>${esc(s.title)}</h2><p ${A("up",1)}>${esc(s.text)}</p></div></div>`;
  case "teacher": return `<div class="slide s-teacher"><div class="bg"></div>
      <div class="photo kb a" style="--an:left;--d:.2s">${s.photo?`<img src="${s.photo}" alt="">`:""}</div>
      <div class="info"><div><span ${A("fade",.4,"chip")}>${s.icon} ${esc(s.cat)}</span></div>
      <div ${A("up",.6,"name")}>${esc(s.name)}</div><div ${A("up",.8,"school")}>${esc(s.school)}</div>
      ${s.quote?`<div ${A("right",1.1,"quote",`font-size:${qsize(s.quote)+(s.quote.length<260?6:0)}px`)}>${s.quote}</div>`:""}</div></div>`;
  case "story": {
      const n=s.people.length, pw=n>2?250:n===1?400:300;
      const body=`<div ${A("right",1.2,"quote",`font-size:${qsize(s.quote)}px`)}>${s.quote}</div>`+(s.achievements?`<div ${A("up",1.6,"ach")}>${s.achievements}</div>`:"");
      return `<div class="slide s-story"><div class="bg"></div><div class="head">
      <span ${A("fade",.2,"chip")}>${s.icon} ${esc(s.label)}</span><h3 ${A("up",.4)}>${esc(s.title)}</h3></div>
      <div class="people">${s.people.map((p,k)=>`<div class="p-card a" style="--an:up;--d:${.6+k*.18}s;width:${pw}px"><div class="ph kb" style="width:${pw}px;height:${pw}px">${p.photo?`<img src="${p.photo}" alt="">`:""}</div><b>${esc(p.name)}</b><small>${esc(p.school)}</small></div>`).join("")}</div>
      <div class="body" style="left:${120+n*(pw+36)+50}px">${body}</div></div>`;}
  case "closing": return `<div class="slide s-closing"><div class="bg light"></div><div class="huella" style="left:50%;top:50%;width:900px;height:900px;margin:-450px 0 0 -450px;opacity:.07"><img src="${HUELLA}" alt=""></div><div class="center">
      <h2 ${A("up",.3)}>${esc(s.title.replace("💛",""))} <span class="heart">💛</span></h2><p ${A("up",.6)}>${esc(s.text)}</p>
      <div ${A("zoom",1,"final")}>${esc(s.final)}</div></div></div>`;
  }
}

const box=$("#slides"); box.innerHTML=SLIDES.map(render).join("");
const els=[...box.children], bars=$("#bottom");
bars.innerHTML=SLIDES.map(()=>"<i><b></b></i>").join("");
const segs=[...bars.children];
SLIDES.forEach(s=>{[s.photo,s.poster,...(s.people||[]).map(p=>p.photo)].forEach(u=>{if(u)new Image().src=u})});

let cur=-1, timer=null, t0=0, remaining=DUR, paused=false, soundOK=false, raf=0;
const video=$(".s-video video");

function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080);$("#stage").style.transform=`translate(-50%,-50%) scale(${k})`}
addEventListener("resize",fit);fit();

function progress(i,frac){segs.forEach((g,k)=>{g.classList.toggle("done",k<i);g.firstChild.style.width=k===i?(frac*100)+"%":""})}
function tick(){cancelAnimationFrame(raf);const step=()=>{if(cur<0)return;let f;
  if(SLIDES[cur].type==="video"){f=video.duration?video.currentTime/video.duration:0}
  else{const el=paused?DUR-remaining:Date.now()-t0+(DUR-remaining);f=Math.min(1,el/DUR)}
  progress(cur,f);raf=requestAnimationFrame(step)};step()}

function schedule(ms){clearTimeout(timer);t0=Date.now();remaining=ms;timer=setTimeout(next,ms)}
function next(){go((cur+1)%SLIDES.length)}
function prev(){go((cur-1+SLIDES.length)%SLIDES.length)}

function show(i){
  els.forEach((e,k)=>{e.classList.toggle("on",k===i)});
  // restart CSS animations on the incoming slide
  const el=els[i];el.querySelectorAll(".a,.kb img,.caticon").forEach(n=>{n.style.animation="none";n.offsetWidth;n.style.animation=""});
  cur=i;remaining=DUR;
  document.body.classList.toggle("videomode",SLIDES[i].type==="video");if(SLIDES[i].type!=="video"){$("#start").classList.remove("show");$("#sound").classList.remove("show")}
  if(SLIDES[i].type==="video"){playVideo()}else{video&&video.pause();schedule(DUR)}
  tick();
}
function go(i){
  if(i===cur)return;clearTimeout(timer);
  const w=$("#wipe");w.classList.remove("go");void w.offsetWidth;w.classList.add("go");
  setTimeout(()=>show(i),cur<0?0:480);
}

async function playVideo(){
  // Siempre arranca solo. Intenta con sonido; si el navegador no lo permite,
  // arranca igual en silencio (los subtítulos van en el video) y el sonido se
  // activa con el primer clic o tecla. Nunca se queda detenido esperando.
  clearTimeout(timer);$("#start").classList.remove("show");
  video.currentTime=0;video.volume=1;video.muted=false;
  try{await video.play();soundOK=true;$("#sound").classList.remove("show")}
  catch(e){
    video.muted=true;
    try{await video.play();$("#sound").classList.add("show")}
    catch(e2){schedule(DUR);return}
  }
  timer=setTimeout(next,VIDEO_MAX);
}
if(video){video.addEventListener("ended",()=>{if(SLIDES[cur].type==="video")next()});video.addEventListener("error",()=>{if(SLIDES[cur].type==="video")schedule(DUR)})}

function startWithSound(){if(!$("#start").classList.contains("show"))return false;$("#start").classList.remove("show");fullscreen();playVideo();return true}
function enableSound(){if(startWithSound())return;soundOK=true;$("#sound").classList.remove("show");if(video&&video.muted){video.muted=false}}
function togglePause(){
  if(SLIDES[cur].type==="video"){video.paused?video.play():video.pause();return}
  paused=!paused;document.body.classList.toggle("pause",paused);
  if(paused){clearTimeout(timer);remaining-=Date.now()-t0}else{t0=Date.now();timer=setTimeout(next,remaining)}
}
function fullscreen(){const d=document.documentElement;(document.fullscreenElement?document.exitFullscreen():d.requestFullscreen&&d.requestFullscreen()).catch?.(()=>{})}

$("#start").addEventListener("click",e=>{e.stopPropagation();startWithSound()});
addEventListener("click",e=>{if(e.target.closest("#start"))return;enableSound()});
addEventListener("keydown",e=>{if(startWithSound()){e.preventDefault();return}enableSound();
  if(e.key==="ArrowRight"||e.key==="PageDown")next();
  else if(e.key==="ArrowLeft"||e.key==="PageUp")prev();
  else if(e.key===" "){e.preventDefault();togglePause()}
  else if(e.key==="f"||e.key==="F")fullscreen();
  });
let idleT;addEventListener("mousemove",()=>{document.body.classList.remove("idle");clearTimeout(idleT);idleT=setTimeout(()=>document.body.classList.add("idle"),2500)});
document.body.classList.add("idle");
// keep the TV screen awake
async function wake(){try{if("wakeLock" in navigator)await navigator.wakeLock.request("screen")}catch(e){}}
wake();document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")wake()});

go(0);
</script>
</body>
</html>
